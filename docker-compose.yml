services:
  goodnotes:
    image: goodnotes
    container_name: goodnotes
    build: .
    command: ["uvicorn", "goodnotes_ocr.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      OLLAMA_URL: "${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}"
    volumes:
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"

  goodnotes-mcp:
    build: .
    env_file:
      - .env
    ports:
      - "${MCP_PORT:-5455}:${MCP_PORT:-5455}"
    environment:
      OLLAMA_URL: "${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
    volumes:
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
